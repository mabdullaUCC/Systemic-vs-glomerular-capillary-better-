<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capillary pressures: skeletal muscle vs glomerulus</title>
<style>
:root{--bg:#f4f7f1;--panel:#e3eed9;--ink:#233024;--mute:#5d6b5e;--chp:#3b64d8;--chpl:#a9bdf3;--cop:#d9482f;--copl:#f4b3a8;--tube:#cf7f7a;--tubel:#f0b6b0;--art:#a8436a;--ven:#5662a8;--net:#2a2a2a;--ax:#7d8a7e;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151b16;--panel:#1f2b20;--ink:#e4ece2;--mute:#9db09f;--chp:#7b9bff;--chpl:#3d4f86;--cop:#ff7a63;--copl:#7a3e36;--tube:#9c5753;--tubel:#c98b86;--art:#d8749b;--ven:#8c97e0;--net:#e9e9e9;--ax:#7d8a7e}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:20px 16px 32px}
h1{font-size:1.5rem;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--mute);max-width:62ch}
.ctl{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;display:flex;gap:12px;align-items:center}
.ctl input{flex:1;min-width:0;accent-color:var(--chp);height:28px}
.ctl span{font-size:.85rem;color:var(--mute);white-space:nowrap}
button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--ax);background:var(--panel);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--chp);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.card{background:var(--panel);border-radius:14px;padding:12px 8px 14px}
.card h2{font-size:1.05rem;text-align:center;margin:4px 0 0}
svg{width:100%;height:auto;display:block}
svg text{fill:var(--ink);font-size:13px}
.m{fill:var(--mute)!important}
.read{text-align:center;font-size:.95rem;margin:4px 8px 0;min-height:3em}
.read b{font-weight:700}
</style>
</head>
<body>
<main>
<h1>Capillary fluid exchange</h1>
<p class="lead">Drag the slider to move along each capillary from its entry to its exit. Blue is capillary hydrostatic pressure (CHP), which pushes fluid out. Red is colloid osmotic pressure (COP), which pulls it back in.</p>
<div class="ctl">
<button id="play" aria-label="Play or pause the animation">Play</button>
<span>Entry</span>
<input id="s" type="range" min="0" max="100" value="0" step="0.5" aria-label="Position along the capillary">
<span>Exit</span>
</div>
<div class="grid" id="grid"></div>
</main>
<script>
const D=[
{t:'Skeletal muscle capillary',chp:[45,15],cop:[25,27],a:'Arterial end',b:'Venous end',out:'Interstitium',inl:'from arteries',outl:'to veins',oc:'var(--ven)'},
{t:'Glomerular capillary',chp:[45,40],cop:[23,40],a:'Afferent end',b:'Efferent end',out:'Urinary space',inl:'afferent arteriole',outl:'efferent arteriole',oc:'var(--art)'}];
const X0=70,X1=420,YT=292,K=1.15;
const lerp=(a,b,t)=>a+(b-a)*t, gy=p=>205-p*3.4;
function arrow(x,y1,y2,c,w){if(Math.abs(y2-y1)<4)return'';const d=y2<y1?-1:1;
return `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2-d*6}" stroke="${c}" stroke-width="${w}"/><polygon points="${x-w-3},${y2-d*7} ${x+w+3},${y2-d*7} ${x},${y2}" fill="${c}"/>`}
function panel(p,t){
const chp=lerp(p.chp[0],p.chp[1],t),cop=lerp(p.cop[0],p.cop[1],t),net=chp-cop,x=lerp(X0,X1,t);
const line=(v,c)=>`<line x1="${X0}" y1="${gy(v[0])}" x2="${X1}" y2="${gy(v[1])}" stroke="${c}" stroke-width="3" stroke-linecap="round"/>`;
const ny=gy(cop),nc=gy(chp);
const lx=Math.min(Math.max(x,120),370);
const state=Math.abs(net)<1?'Equilibrium: no net movement':net>0?'Net filtration: fluid leaves the capillary':'Net reabsorption: fluid returns to the capillary';
const svg=`<svg viewBox="0 0 460 410" role="img" aria-label="${p.t} pressures">
<text x="14" y="${gy(45)+4}" class="m">45</text><text x="14" y="${gy(15)+4}" class="m">15</text>
<text transform="translate(8,${gy(30)}) rotate(-90)" class="m" text-anchor="middle" style="font-size:11px">mm Hg</text>
<line x1="${X0}" y1="25" x2="${X0}" y2="205" stroke="var(--ax)"/><line x1="${X0}" y1="205" x2="${X1}" y2="205" stroke="var(--ax)"/>
${[15,45].map(v=>`<line x1="${X0-4}" y1="${gy(v)}" x2="${X0}" y2="${gy(v)}" stroke="var(--ax)"/>`).join('')}
${line(p.chp,'var(--chp)')}${line(p.cop,'var(--cop)')}
<text x="${X0+6}" y="${gy(p.chp[0])-8}" fill="var(--chp)" style="fill:var(--chp)">CHP</text>
<text x="${X0+6}" y="${gy(p.cop[0])+20}" style="fill:var(--cop)">COP</text>
<line x1="${x}" y1="25" x2="${x}" y2="205" stroke="var(--ax)" stroke-dasharray="3 4"/>
${net>=0?arrow(x,ny,nc,'var(--net)',2.5):arrow(x,nc,ny,'var(--net)',2.5)}
<circle cx="${x}" cy="${nc}" r="5" fill="var(--chp)"/><circle cx="${x}" cy="${ny}" r="5" fill="var(--cop)"/>
<text x="${X0}" y="228" text-anchor="start" class="m">${p.a}</text><text x="${X1}" y="228" text-anchor="end" class="m">${p.b}</text>
<text x="${lx}" y="${YT-K*55-14}" text-anchor="middle" style="fill:var(--chp)">CHP ${chp.toFixed(0)}</text>
<text x="${lx}" y="${YT-K*55}" text-anchor="middle" style="fill:var(--cop)">COP ${cop.toFixed(0)}</text>
<rect x="${X0}" y="${YT}" width="${X1-X0}" height="64" rx="30" fill="var(--tube)"/>
<rect x="${X0+14}" y="${YT+6}" width="${X1-X0-28}" height="5" rx="2.5" fill="var(--tubel)"/>
<text x="${(X0+X1)/2}" y="${YT+38}" text-anchor="middle" style="fill:#fff">Capillary</text>
${arrow(x-15,YT,YT-Math.abs(net)*K,'var(--net)',2.5).replace(/.*/,s=>net>=0?s:arrow(x-15,YT-Math.abs(net)*K,YT,'var(--net)',2.5))}
${arrow(x,YT,YT-chp*K,'var(--chp)',3)}
${arrow(x+15,YT-cop*K,YT,'var(--cop)',3)}
<g fill="none"><path d="M12 ${YT+32}H52" stroke="var(--art)" stroke-width="8"/></g>
<polygon points="52,${YT+22} 68,${YT+32} 52,${YT+42}" fill="var(--art)"/>
<path d="M${X1+2} ${YT+32}H${X1+22}" stroke="${p.oc}" stroke-width="8"/><polygon points="${X1+22},${YT+22} ${X1+38},${YT+32} ${X1+22},${YT+42}" fill="${p.oc}"/>
<text x="40" y="${YT+62}" text-anchor="middle" class="m" style="font-size:11px">${p.inl}</text>
<text x="${X1+20}" y="${YT+62}" text-anchor="middle" class="m" style="font-size:11px">${p.outl}</text>
<text x="${(X0+X1)/2}" y="396" text-anchor="middle" class="m">${p.out}</text>
</svg>`;
return `<h2>${p.t}</h2>${svg}<div class="read"><b>${chp.toFixed(0)} − ${cop.toFixed(0)} = ${net>0?'+':''}${net.toFixed(0)} mm Hg</b><br>${state}</div>`}
const g=document.getElementById('grid');
D.forEach(()=>{const c=document.createElement('div');c.className='card';g.appendChild(c)});
const s=document.getElementById('s'),btn=document.getElementById('play');
function draw(){const t=s.value/100;[...g.children].forEach((c,i)=>c.innerHTML=panel(D[i],t))}
s.addEventListener('input',draw);draw();
let raf=null,last=0;
function step(ts){if(!last)last=ts;const dt=ts-last;last=ts;let v=+s.value+dt/60;
if(v>=100){v=100;s.value=v;draw();stop();return}s.value=v;draw();raf=requestAnimationFrame(step)}
function stop(){cancelAnimationFrame(raf);raf=null;last=0;btn.textContent='Play'}
btn.addEventListener('click',()=>{if(raf){stop();return}if(+s.value>=100)s.value=0;btn.textContent='Pause';raf=requestAnimationFrame(step)});
</script>
</body>
</html>
